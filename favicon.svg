<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f2edff"/>
      <stop offset="100%" stop-color="#ded4fb"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5a4880" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background circle for favicon contrast in any browser theme -->
  <circle cx="32" cy="32" r="30" fill="#ede8ff"/>

  <!-- Tiny Cloud Body -->
  <g filter="url(#softShadow)">
    <path d="M 18 38
             A 10 10 0 0 1 24 22
             A 12 12 0 0 1 40 20
             A 11 11 0 0 1 48 30
             A 9 9 0 0 1 46 42
             L 20 42
             A 8 8 0 0 1 18 38 Z"
          fill="url(#cloudGrad)" stroke="#b8a8e3" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Cheeks -->
  <ellipse cx="23" cy="35" rx="2.5" ry="1.5" fill="#fca8c9" opacity="0.85"/>
  <ellipse cx="41" cy="35" rx="2.5" ry="1.5" fill="#fca8c9" opacity="0.85"/>

  <!-- Eyes -->
  <circle cx="27" cy="31" r="2" fill="#3a2f55"/>
  <circle cx="37" cy="31" r="2" fill="#3a2f55"/>
  <circle cx="26.3" cy="30.3" r="0.7" fill="#ffffff"/>
  <circle cx="36.3" cy="30.3" r="0.7" fill="#ffffff"/>

  <!-- Gentle Smile -->
  <path d="M 30 35 Q 32 37.5 34 35" fill="none" stroke="#68558a" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Golden Star Companion -->
  <path d="M 48 16 L 49.5 20 L 53.5 20 L 50.2 22.5 L 51.5 26.5 L 48 24 L 44.5 26.5 L 45.8 22.5 L 42.5 20 L 46.5 20 Z"
        fill="#ffdb58" stroke="#d49c24" stroke-width="0.8"/>
  <circle cx="48" cy="22" r="1.5" fill="#fff9db"/>
</svg>
