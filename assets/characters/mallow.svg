<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Cloud Body -->
  <path d="M 28 58 C 14 58, 8 46, 18 36 C 14 26, 26 14, 38 20 C 44 10, 60 10, 66 20 C 78 14, 90 26, 86 36 C 96 46, 88 58, 76 58 Z" fill="#ffffff" stroke="#cdeafc" stroke-width="2.5" filter="url(#softGlow)"/>
  <!-- Rosy Cheeks -->
  <circle cx="34" cy="42" r="5" fill="#ffa8c5" opacity="0.65"/>
  <circle cx="66" cy="42" r="5" fill="#ffa8c5" opacity="0.65"/>
  <!-- Eyes -->
  <ellipse cx="40" cy="38" rx="2.5" ry="3.5" fill="#2d3748"/>
  <circle cx="41.2" cy="36.5" r="1" fill="#ffffff"/>
  <ellipse cx="60" cy="38" rx="2.5" ry="3.5" fill="#2d3748"/>
  <circle cx="61.2" cy="36.5" r="1" fill="#ffffff"/>
  <!-- Smile -->
  <path d="M 46 43 Q 50 47 54 43" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
  <!-- Little Golden Star Accents -->
  <polygon points="50,10 52,14 56,15 53,18 54,22 50,20 46,22 47,18 44,15 48,14" fill="#ffcb3d"/>
</svg>
